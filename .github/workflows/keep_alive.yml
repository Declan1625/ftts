name: Keep Render Alive

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: curl -sf https://ftts.onrender.com/health || true

      - name: Trigger pipeline
        run: curl -sf https://ftts.onrender.com/run || true
